# TinyRPC 配置文件
# 格式: key=value (不支持空格)

# ========== 服务器配置 ==========
# RPC服务器监听IP地址
rpcserverip=127.0.0.1
# RPC服务器监听端口
rpcserverport=8000

# ========== ZooKeeper配置 ==========
# ZooKeeper服务器IP地址
zookeeperip=127.0.0.1
# ZooKeeper服务器端口
zookeeperport=2181
# ZooKeeper连接超时时间(毫秒)
zookeeper_timeout=30000

# ========== 连接池配置 ==========
# 每个地址的最大连接数
connectionpool_max_connections=100
# 连接最大空闲时间(秒)
connectionpool_max_idle_time=300
# 连接超时时间(秒)
connectionpool_connection_timeout=10

# ========== 内存池配置 ==========
# 内存块大小(字节)
memorypool_block_size=4096
# 预分配内存块数量
memorypool_prealloc_count=10

# ========== 日志配置 ==========
# 日志级别: DEBUG, INFO, WARN, ERROR
log_level=INFO
# 日志文件路径
log_file=./logs/tinyrpc.log
# 日志文件最大大小(MB)
log_max_size=100
# 日志文件最大数量
log_max_files=10

# ========== 性能配置 ==========
# 工作线程数量(0表示使用CPU核心数)
worker_threads=0
# 是否启用性能监控
enable_metrics=true
# 监控数据导出端口
metrics_port=8080

# ========== 安全配置 ==========
# 是否启用TLS
enable_tls=false
# TLS证书文件路径
tls_cert_file=./certs/server.crt
# TLS私钥文件路径
tls_key_file=./certs/server.key
# CA证书文件路径
tls_ca_file=./certs/ca.crt